<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch Chat Overlay</title>
<style>
:root{--accent:#9b8cff;--text:#f5f5f7;--bubble:rgba(20,20,27,.94);--name:#9b8cff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--text);font:700 18px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body.dark{background:#0b0b0f}.chat{display:flex;flex-direction:column;gap:9px;padding:12px}.message{display:flex;align-items:flex-start;gap:8px;max-width:100%;animation:pop .22s ease-out}.avatar{display:none}.bubble{max-width:100%;overflow-wrap:anywhere;padding:9px 12px;border-radius:12px;background:var(--bubble);border:1px solid #ffffff14;box-shadow:0 4px 16px #0002}.name{display:inline-block;color:var(--name);font-size:.9em;margin-right:7px;font-weight:900}.text{font-weight:650}.template-terminal .bubble{background:#100d20;border:1px solid #9b8cff;border-radius:3px;font-family:ui-monospace,monospace;color:#d9d0ff}.template-terminal .name{color:var(--name,#9b8cff)}.template-neon .bubble{background:#171024;border:1px solid #c65bff;box-shadow:0 0 14px #c65bff3b}.template-neon .name{color:#e7a4ff}.template-soft .bubble{background:#f4e7d9;color:#503d35;border:0;border-radius:18px}.template-soft .name{color:#a45f46}.template-pixel .bubble{background:#25203e;border:2px solid #9b8cff;border-radius:3px;box-shadow:4px 4px 0 #0a0913}.template-pixel .name{color:var(--name,#9b8cff)}.template-glass .bubble{background:#ffffff18;border:1px solid #ffffff3b;backdrop-filter:blur(8px);border-radius:14px}.template-minimal .bubble{background:transparent;border:0;border-left:3px solid var(--accent);border-radius:0;box-shadow:none;padding:5px 9px}.template-minimal .name{color:var(--accent)}
#status{position:fixed;left:12px;bottom:12px;font-size:11px;color:#aaa;background:#111b;padding:5px 8px;border-radius:6px}#status:empty{display:none}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.template-aurora .bubble{background:#102c39;border:1px solid #9b8cff99;border-radius:12px;box-shadow:0 0 12px #9b8cff22;color:#f7f7fb}.template-aurora .name{color:#b8aaff}.template-cyber .bubble{background:#21112c;border:1px solid #ffea0099;border-radius:12px;box-shadow:0 0 12px #ffea0022;color:#f7f7fb}.template-cyber .name{color:#ffea00}.template-vhs .bubble{background:#25142a;border:1px solid #ff668c99;border-radius:12px;box-shadow:0 0 12px #ff668c22;color:#f7f7fb}.template-vhs .name{color:#ff668c}.template-sakura .bubble{background:#402238;border:1px solid #ff9dc899;border-radius:12px;box-shadow:0 0 12px #ff9dc822;color:#f7f7fb}.template-sakura .name{color:#ff9dc8}.template-ocean .bubble{background:#10283b;border:1px solid #59d8ff99;border-radius:12px;box-shadow:0 0 12px #59d8ff22;color:#f7f7fb}.template-ocean .name{color:#59d8ff}.template-bloodmoon .bubble{background:#2a1018;border:1px solid #ff455e99;border-radius:12px;box-shadow:0 0 12px #ff455e22;color:#f7f7fb}.template-bloodmoon .name{color:#ff455e}.template-gold .bubble{background:#292013;border:1px solid #ffd36a99;border-radius:12px;box-shadow:0 0 12px #ffd36a22;color:#f7f7fb}.template-gold .name{color:#ffd36a}.template-comic .bubble{background:#fff1c7;border:1px solid #ffde5999;border-radius:3px;box-shadow:0 0 12px #ffde5922;color:#f7f7fb}.template-comic .name{color:#ffde59}.template-matrix .bubble{border-radius:0;background:#100d20;border-left:2px solid #9b8cff}.template-matrix .name{color:#9b8cff}.template-bubblegum .bubble{background:#352044;border:1px solid #ff8de199;border-radius:12px;box-shadow:0 0 12px #ff8de122;color:#f7f7fb}.template-bubblegum .name{color:#ff8de1}.template-mono .bubble{background:#202020;border:1px solid #ffffff99;border-radius:12px;box-shadow:0 0 12px #ffffff22;color:#f7f7fb}.template-mono .name{color:#ffffff}.template-ember .bubble{background:#2b1710;border:1px solid #ff8a3d99;border-radius:12px;box-shadow:0 0 12px #ff8a3d22;color:#f7f7fb}.template-ember .name{color:#ff8a3d}
/* Distinct chat layouts, not just recolored bubbles */
.template-neon .msg,.template-cyber .msg{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.template-neon .name,.template-cyber .name{order:0;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.template-neon .bubble,.template-cyber .bubble{order:1;border-radius:4px 13px 13px 13px}
.template-soft .chat{align-items:flex-start}.template-soft .msg{display:flex;flex-direction:column;gap:3px}.template-soft .name{padding-left:10px}.template-soft .bubble{border-radius:18px 18px 18px 5px}
.template-pixel .msg{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px}.template-pixel .name{color:var(--name,#9b8cff)}.template-pixel .bubble{background:#25203e;border:2px solid #9b8cff;border-radius:3px;box-shadow:4px 4px 0 #0a0913}
.template-glass .msg{width:100%}.template-glass .bubble{width:100%;display:flex;flex-direction:column;gap:3px}
.template-minimal .msg{border-bottom:1px solid var(--line);padding-bottom:5px}.template-minimal .name{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.template-aurora .msg:nth-child(even){margin-left:18px}.template-aurora .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(120deg,#102c39,#24314a)}
.template-vhs .msg{transform:rotate(-.5deg)}.template-vhs .msg:nth-child(even){transform:rotate(.5deg)}.template-vhs .bubble{border-radius:2px 8px 2px 8px;text-shadow:1px 0 #ff668c}
.template-sakura .msg{display:flex;flex-direction:row-reverse;justify-content:flex-end}.template-sakura .bubble{border-radius:18px 18px 4px 18px}
.template-ocean .msg{display:grid;grid-template-columns:1fr;gap:2px}.template-ocean .name{padding-left:8px}.template-ocean .bubble{border-radius:4px 14px 14px 14px;background:linear-gradient(100deg,#10283b,#153a4c)}
.template-bloodmoon .msg:nth-child(even){margin-left:14px}.template-bloodmoon .bubble{border-left:3px solid #ff455e;border-radius:3px 10px 10px 3px}
.template-gold .msg{display:flex;align-items:center;gap:7px}.template-gold .name{padding:4px 6px;border:1px solid #ffd36a66;border-radius:4px;font-size:10px}
.template-comic .msg{display:flex;flex-direction:column;gap:2px}.template-comic .bubble{border:2px solid #171321;border-radius:3px;box-shadow:3px 3px 0 #ff8a3d;color:#201b28}.template-comic .name{color:#ffde59!important;text-shadow:1px 1px #171321}
.template-matrix .msg{font-family:ui-monospace,monospace}.template-matrix .bubble{border-radius:0;background:#100d20;border-left:2px solid #9b8cff}
.template-bubblegum .msg{display:flex;flex-direction:column;gap:2px}.template-bubblegum .bubble{border-radius:22px;background:linear-gradient(120deg,#352044,#512d58)}
.template-mono .bubble{border-radius:0;background:#202020;border-left:3px solid #fff}.template-mono .name{color:#fff!important}
.template-ember .msg:nth-child(even){margin-left:12px}.template-ember .bubble{border-radius:3px 12px 3px 12px;background:linear-gradient(120deg,#2b1710,#432217)}
.role-badges{display:inline-flex;gap:3px;align-items:center;margin-right:5px;vertical-align:middle}.role-badge{display:inline-block;width:18px;height:18px;object-fit:contain;vertical-align:middle}.role-badge.fallback{width:auto;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font:900 9px/15px system-ui;background:#4c87ff;color:#fff}
</style></head><body><div id="chat" class="chat"></div><div id="status">Подключаемся к Twitch…</div>
<script>
const params=new URLSearchParams(location.search),channel=(params.get("channel")||"").replace(/^@/,"").toLowerCase(),theme=params.get("theme")||"terminal",background=params.get("background")||"transparent";
if(!/^[a-z0-9_]{1,25}$/.test(channel)){document.getElementById("status").textContent="Укажи Twitch-канал в параметре channel";throw new Error("Invalid Twitch channel")}
document.body.classList.add("template-"+(["terminal","neon","soft","pixel","glass","minimal","aurora","cyber","vhs","sakura","ocean","bloodmoon","gold","comic","matrix","bubblegum","mono","ember"].includes(theme)?theme:"terminal"));if(background==="dark")document.body.classList.add("dark");
const chat=document.getElementById("chat"),status=document.getElementById("status");let socket=null,retry=1000,closed=false;
const badgeImages=new Map();
async function loadOfficialBadges(){try{const res=await fetch("https://badges.twitch.tv/v1/badges/global/display");if(!res.ok)return;const data=await res.json();for(const [setId,set] of Object.entries(data.badge_sets||{})){for(const version of Object.values(set.versions||{})){if(version.image_url_1x)badgeImages.set(setId+"/"+version.id,version.image_url_1x);}}}catch(e){console.warn("Twitch badge lookup unavailable",e)}}
loadOfficialBadges();
function renderBadge(setId,version,label,cls){const url=badgeImages.get(setId+"/"+version)||badgeImages.get(setId+"/1");if(url){const img=document.createElement("img");img.className="role-badge";img.src=url;img.alt=label;img.title=label;img.loading="lazy";roles.append(img)}else{const b=document.createElement("span");b.className="role-badge fallback "+cls;b.textContent=label;roles.append(b)}}
function showStatus(s){status.textContent=s}
function addMessage(user,text,tags=""){if(!text)return;const row=document.createElement("div");row.className="message";const bubble=document.createElement("div");bubble.className="bubble";const name=document.createElement("span");name.className="name";const roles=document.createElement("span");roles.className="role-badges";const tagMap=Object.fromEntries(tags.split(";").filter(Boolean).map(x=>{const i=x.indexOf("=");return i<0?[x,""]:[x.slice(0,i),x.slice(i+1)]}));const badges=(tagMap.badges||"").split(",").filter(Boolean);const userType=tagMap["user-type"]||"";for(const entry of badges){const [setId,version]=entry.split("/");const labels={broadcaster:["Владелец","owner"],moderator:["Модератор","mod"],vip:["VIP","vip"],subscriber:["Подписчик","sub"],founder:["Основатель","sub"],staff:["Twitch Staff","owner"],admin:["Администратор","owner"],global_mod:["Глобальный модератор","mod"],bits:["Bits","sub"]};if(labels[setId])renderBadge(setId,version,labels[setId][0],labels[setId][1]);}if(userType==="mod"&&!badges.some(x=>x.startsWith("moderator/")))renderBadge("moderator","1","Модератор","mod");if(roles.childNodes.length)name.append(roles);name.append(document.createTextNode(user));const userColor=(tagMap.color||"").trim();if(/^#[0-9a-fA-F]{6}$/.test(userColor))name.style.color=userColor;const body=document.createElement("span");body.className="text";body.textContent=text;bubble.append(name,body);row.append(bubble);chat.append(row);while(chat.children.length>35)chat.firstElementChild.remove();showStatus("");}
function parseLine(line){if(line.startsWith("PING")){socket?.send("PONG :tmi.twitch.tv");return}const m=line.match(/^(?:@([^ ]+) )?(?::([^! ]+)!([^ ]+) )?PRIVMSG #[^ ]+ :(.*)$/);if(!m)return;const tags=m[1]||"",user=m[2]||"Зритель",text=m[4]||"";let display=user;const displayTag=tags.split(";").find(x=>x.startsWith("display-name="));if(displayTag)try{display=decodeURIComponent(displayTag.slice(13).replace(/\\s/g,"%20"))}catch{}addMessage(display,text,tags)}
function connect(){if(closed)return;try{socket=new WebSocket("wss://irc-ws.chat.twitch.tv:443")}catch{showStatus("Не удалось создать соединение");return}socket.onopen=()=>{retry=1000;socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");socket.send("PASS SCHMOOPIIE");socket.send("NICK justinfan"+Math.floor(Math.random()*900000+100000));socket.send("JOIN #"+channel);showStatus("Подключено к #"+channel)};socket.onmessage=e=>String(e.data).split("\r\n").forEach(parseLine);socket.onerror=()=>showStatus("Ошибка соединения с Twitch");socket.onclose=()=>{if(!closed){showStatus("Соединение потеряно — переподключаемся…");setTimeout(connect,retry);retry=Math.min(retry*2,15000)}}}
connect();window.addEventListener("beforeunload",()=>{closed=true;try{socket?.close()}catch{}});
</script></body></html>
