<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch Chat Overlay</title>
<style>
:root{--accent:#b9ff36;--text:#f5f5f7;--bubble:rgba(20,20,27,.94);--name:#b9ff36}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--text);font:700 18px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body.dark{background:#0b0b0f}.chat{display:flex;flex-direction:column;gap:9px;padding:12px}.message{display:flex;align-items:flex-start;gap:8px;max-width:100%;animation:pop .22s ease-out}.avatar{display:none}.bubble{max-width:100%;overflow-wrap:anywhere;padding:9px 12px;border-radius:12px;background:var(--bubble);border:1px solid #ffffff14;box-shadow:0 4px 16px #0002}.name{display:inline-block;color:var(--name);font-size:.9em;margin-right:7px;font-weight:900}.text{font-weight:650}.template-terminal .bubble{background:#071a12;border:1px solid #32e89a;border-radius:3px;font-family:ui-monospace,monospace}.template-terminal .name{color:#58f0a5}.template-neon .bubble{background:#171024;border:1px solid #c65bff;box-shadow:0 0 14px #c65bff3b}.template-neon .name{color:#e7a4ff}.template-soft .bubble{background:#f4e7d9;color:#503d35;border:0;border-radius:18px}.template-soft .name{color:#a45f46}.template-pixel .bubble{background:#254b29;border:2px solid #8ce36c;border-radius:3px;box-shadow:4px 4px 0 #0a190d}.template-pixel .name{color:#a9f37c}.template-glass .bubble{background:#ffffff18;border:1px solid #ffffff3b;backdrop-filter:blur(8px);border-radius:14px}.template-minimal .bubble{background:transparent;border:0;border-left:3px solid var(--accent);border-radius:0;box-shadow:none;padding:5px 9px}.template-minimal .name{color:var(--accent)}
#status{position:fixed;left:12px;bottom:12px;font-size:11px;color:#aaa;background:#111b;padding:5px 8px;border-radius:6px}#status:empty{display:none}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.template-aurora .bubble{background:#102c39;border:1px solid #65f7d099;border-radius:12px;box-shadow:0 0 12px #65f7d022;color:#f7f7fb}.template-aurora .name{color:#65f7d0}.template-cyber .bubble{background:#21112c;border:1px solid #ffea0099;border-radius:12px;box-shadow:0 0 12px #ffea0022;color:#f7f7fb}.template-cyber .name{color:#ffea00}.template-vhs .bubble{background:#25142a;border:1px solid #ff668c99;border-radius:12px;box-shadow:0 0 12px #ff668c22;color:#f7f7fb}.template-vhs .name{color:#ff668c}.template-sakura .bubble{background:#402238;border:1px solid #ff9dc899;border-radius:12px;box-shadow:0 0 12px #ff9dc822;color:#f7f7fb}.template-sakura .name{color:#ff9dc8}.template-ocean .bubble{background:#10283b;border:1px solid #59d8ff99;border-radius:12px;box-shadow:0 0 12px #59d8ff22;color:#f7f7fb}.template-ocean .name{color:#59d8ff}.template-bloodmoon .bubble{background:#2a1018;border:1px solid #ff455e99;border-radius:12px;box-shadow:0 0 12px #ff455e22;color:#f7f7fb}.template-bloodmoon .name{color:#ff455e}.template-gold .bubble{background:#292013;border:1px solid #ffd36a99;border-radius:12px;box-shadow:0 0 12px #ffd36a22;color:#f7f7fb}.template-gold .name{color:#ffd36a}.template-comic .bubble{background:#fff1c7;border:1px solid #ffde5999;border-radius:3px;box-shadow:0 0 12px #ffde5922;color:#f7f7fb}.template-comic .name{color:#ffde59}.template-matrix .bubble{background:#061b12;border:1px solid #39ff8899;border-radius:12px;box-shadow:0 0 12px #39ff8822;color:#f7f7fb}.template-matrix .name{color:#39ff88}.template-bubblegum .bubble{background:#352044;border:1px solid #ff8de199;border-radius:12px;box-shadow:0 0 12px #ff8de122;color:#f7f7fb}.template-bubblegum .name{color:#ff8de1}.template-mono .bubble{background:#202020;border:1px solid #ffffff99;border-radius:12px;box-shadow:0 0 12px #ffffff22;color:#f7f7fb}.template-mono .name{color:#ffffff}.template-ember .bubble{background:#2b1710;border:1px solid #ff8a3d99;border-radius:12px;box-shadow:0 0 12px #ff8a3d22;color:#f7f7fb}.template-ember .name{color:#ff8a3d}</style></head><body><div id="chat" class="chat"></div><div id="status">Подключаемся к Twitch…</div>
<script>
const params=new URLSearchParams(location.search),channel=(params.get("channel")||"").replace(/^@/,"").toLowerCase(),theme=params.get("theme")||"terminal",background=params.get("background")||"transparent";
if(!/^[a-z0-9_]{1,25}$/.test(channel)){document.getElementById("status").textContent="Укажи Twitch-канал в параметре channel";throw new Error("Invalid Twitch channel")}
document.body.classList.add("template-"+(["terminal","neon","soft","pixel","glass","minimal","aurora","cyber","vhs","sakura","ocean","bloodmoon","gold","comic","matrix","bubblegum","mono","ember"].includes(theme)?theme:"terminal"));if(background==="dark")document.body.classList.add("dark");
const chat=document.getElementById("chat"),status=document.getElementById("status");let socket=null,retry=1000,closed=false;
function showStatus(s){status.textContent=s}
function addMessage(user,text){if(!text)return;const row=document.createElement("div");row.className="message";const bubble=document.createElement("div");bubble.className="bubble";const name=document.createElement("span");name.className="name";name.textContent=user;const body=document.createElement("span");body.className="text";body.textContent=text;bubble.append(name,body);row.append(bubble);chat.append(row);while(chat.children.length>35)chat.firstElementChild.remove();showStatus("");}
function parseLine(line){if(line.startsWith("PING")){socket?.send("PONG :tmi.twitch.tv");return}const m=line.match(/^(?:@([^ ]+) )?(?::([^! ]+)!([^ ]+) )?PRIVMSG #[^ ]+ :(.*)$/);if(!m)return;const tags=m[1]||"",user=m[2]||"Зритель",text=m[4]||"";let display=user;const displayTag=tags.split(";").find(x=>x.startsWith("display-name="));if(displayTag)try{display=decodeURIComponent(displayTag.slice(13).replace(/\\s/g,"%20"))}catch{}addMessage(display,text)}
function connect(){if(closed)return;try{socket=new WebSocket("wss://irc-ws.chat.twitch.tv:443")}catch{showStatus("Не удалось создать соединение");return}socket.onopen=()=>{retry=1000;socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");socket.send("PASS SCHMOOPIIE");socket.send("NICK justinfan"+Math.floor(Math.random()*900000+100000));socket.send("JOIN #"+channel);showStatus("Подключено к #"+channel)};socket.onmessage=e=>String(e.data).split("\r\n").forEach(parseLine);socket.onerror=()=>showStatus("Ошибка соединения с Twitch");socket.onclose=()=>{if(!closed){showStatus("Соединение потеряно — переподключаемся…");setTimeout(connect,retry);retry=Math.min(retry*2,15000)}}}
connect();window.addEventListener("beforeunload",()=>{closed=true;try{socket?.close()}catch{}});
</script></body></html>
