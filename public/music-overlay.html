<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Музыка · 1°6 Community</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}#wrap{position:relative;width:100%;height:100%;background:#08080b;overflow:hidden;border-radius:10px}#player{position:absolute;inset:0;width:100%;height:100%}#status{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border:1px solid #ffffff24;border-radius:10px;background:#101014df;color:#eee;line-height:1.35;pointer-events:none;text-shadow:0 1px 2px #000}#status:empty{display:none}#status small{display:block;margin-top:3px;color:#bbb}</style></head>
<body><div id="wrap"><div id="player"></div><div id="status">Музыкальная очередь готова.<small>Когда стример запустит трек, он появится здесь.</small></div></div>
<script>
(function(){const p=new URLSearchParams(location.search),channel=(p.get("channel")||"").trim().replace(/^@/,"").toLowerCase(),status=document.getElementById("status");if(!/^[a-z0-9_]{1,25}$/.test(channel)){status.textContent="В ссылке не указан корректный Twitch-канал.";return}let player=null,currentId="",loadedQueueId="",lastError="";
function say(title,detail){status.replaceChildren();const b=document.createElement("span");b.textContent=title;status.append(b);if(detail){const s=document.createElement("small");s.textContent=detail;status.append(s)}}
async function queue(){const r=await fetch("/api/music/queue?channel="+encodeURIComponent(channel),{cache:"no-store"});if(!r.ok)throw Error("Не удалось получить очередь");return(await r.json()).items||[]}
async function ended(id){try{await fetch("/api/music/overlay/ended",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channel,id})})}catch(_){}}
async function poll(){try{const items=await queue(),playing=items.find(x=>x.status==="playing");lastError="";if(playing){if(playing.id!==currentId){currentId=playing.id;say("Сейчас играет: "+(playing.title||"YouTube-трек"),"Заказал: "+playing.nickname);}else say("Сейчас играет: "+(playing.title||"YouTube-трек"),"Заказал: "+playing.nickname);if(player&&typeof player.loadVideoById==="function"&&loadedQueueId!==playing.id){loadedQueueId=playing.id;player.loadVideoById({videoId:playing.videoId})}}else{if(currentId){currentId="";if(player&&typeof player.stopVideo==="function")player.stopVideo()}say("Ожидаем заказ музыки","Очередь канала "+channel+" пока не запущена.")}}catch(e){if(lastError!==e.message){say("Не удалось загрузить очередь",e.message);lastError=e.message}}}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("player",{width:"100%",height:"100%",videoId:"",playerVars:{autoplay:1,controls:1,rel:0,modestbranding:1,playsinline:1,enablejsapi:1,origin:location.origin},events:{onReady:function(){poll()},onStateChange:function(e){if(e.data===YT.PlayerState.ENDED&&currentId){const id=currentId;ended(id).finally(()=>{if(currentId===id)currentId="";setTimeout(poll,600)})}},onError:function(e){say("YouTube не смог воспроизвести видео","Код ошибки: "+e.data+". Проверь доступность ролика и ограничения встраивания.")}}})};
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";tag.async=true;document.head.append(tag);setInterval(poll,3500);poll()})();
</script></body></html>
