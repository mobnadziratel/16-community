<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="transparent">
<title>Music video overlay · 1°6 Community</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font:14px system-ui,-apple-system,Segoe UI,sans-serif}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:transparent!important}
#videoLayer{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;opacity:0;pointer-events:none;background:transparent;transition:opacity .12s linear}
#videoLayer.is-active{visibility:visible;opacity:1;pointer-events:auto}
#player,#player iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<div id="wrap"><div id="videoLayer"><div id="player"></div></div></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const channel=(params.get("channel")||"").trim().replace(/^@/,"").toLowerCase();
  const previewMode=params.get("preview")==="1";
  const layer=document.getElementById("videoLayer");
  if(!/^[a-z0-9_]{1,25}$/.test(channel))return;

  let player=null;
  let currentId="";
  let loadedQueueId="";
  let pollInProgress=false;

  function showVideo(){layer.classList.add("is-active")}
  function hideVideo(stop){
    layer.classList.remove("is-active");
    if(stop&&player&&typeof player.stopVideo==="function"){
      try{player.stopVideo()}catch(_){}
    }
  }
  async function getQueue(){
    const response=await fetch("/api/music/queue?channel="+encodeURIComponent(channel),{cache:"no-store"});
    if(!response.ok)throw Error("Queue request failed");
    const data=await response.json();
    return Array.isArray(data.items)?data.items:[];
  }
  async function markEnded(id){
    try{
      await fetch("/api/music/overlay/ended",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({channel,id})
      });
    }catch(_){}
  }
  async function poll(){
    if(pollInProgress)return;
    pollInProgress=true;
    try{
      const items=await getQueue();
      const playing=items.find(item=>item&&item.status==="playing"&&/^[A-Za-z0-9_-]{11}$/.test(String(item.videoId||"")));
      if(!playing){
        const hadCurrent=Boolean(currentId);
        currentId="";
        loadedQueueId="";
        hideVideo(hadCurrent);
        return;
      }
      showVideo();
      if(playing.id!==currentId||playing.id!==loadedQueueId){
        currentId=playing.id;
        loadedQueueId=playing.id;
        if(player&&typeof player.loadVideoById==="function"){
          player.loadVideoById({videoId:playing.videoId,startSeconds:0});
        }
      }
    }catch(_){
      currentId="";
      loadedQueueId="";
      hideVideo(true);
    }finally{
      pollInProgress=false;
    }
  }

  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player("player",{
      width:"100%",
      height:"100%",
      playerVars:{
        autoplay:1,
        controls:0,
        rel:0,
        modestbranding:1,
        playsinline:1,
        enablejsapi:1,
        origin:location.origin
      },
      events:{
        onReady:function(){
          if(previewMode&&player&&typeof player.mute==="function")player.mute();
          poll();
        },
        onStateChange:function(event){
          if(event.data===YT.PlayerState.ENDED&&currentId){
            const finishedId=currentId;
            currentId="";
            loadedQueueId="";
            hideVideo(false);
            markEnded(finishedId).finally(function(){setTimeout(poll,350)});
          }
        },
        onError:function(){
          currentId="";
          loadedQueueId="";
          hideVideo(true);
        }
      }
    });
  };

  const apiScript=document.createElement("script");
  apiScript.src="https://www.youtube.com/iframe_api";
  apiScript.async=true;
  document.head.appendChild(apiScript);
  poll();
  setInterval(poll,2500);
})();
</script>
</body>
</html>
