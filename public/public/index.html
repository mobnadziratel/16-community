<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>Стримеры Twitch</title>
<style>
:root{--bg:#0b0b0f;--panel:#14141b;--panel2:#1a1a23;--text:#f5f5f7;--muted:#9a9aa8;--accent:#b9ff36;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#292b20 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
header{padding:28px 0 24px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.06em;font-size:21px}
.logo{width:42px;height:42px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:21px;font-weight:1000;letter-spacing:-.09em;border-radius:11px;box-shadow:0 0 30px #b9ff3622}
.navtag{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 13px}
.hero{padding:62px 0 34px;max-width:760px}
.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.19em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.eyebrow:before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-.065em;margin:18px 0 16px;font-weight:950}
h1 span{color:var(--accent)}
.lead{font-size:16px;line-height:1.7;color:var(--muted);max-width:570px;margin:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 18px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}.count strong{color:var(--text);font-size:15px}
.search{position:relative;min-width:min(100%,290px);width:330px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);outline:none;color:var(--text);border-radius:13px;padding:13px 15px 13px 42px;font:inherit;font-size:14px;transition:.2s}
.search input:focus{border-color:#b9ff3677;box-shadow:0 0 0 3px #b9ff3610}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:62px}
.streamer{position:relative;display:flex;align-items:center;gap:16px;padding:17px;background:linear-gradient(130deg,#17171f,#121218);border:1px solid var(--line);border-radius:18px;min-width:0;transition:transform .18s,border-color .18s,background .18s}
.streamer:hover{transform:translateY(-3px);border-color:#b9ff3677;background:linear-gradient(130deg,#20251a,#15151c)}
.avatar{width:64px;height:64px;flex:0 0 64px;border-radius:16px;overflow:hidden;background:#26262f;box-shadow:0 0 0 1px #ffffff12}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.name{font-size:17px;font-weight:800;letter-spacing:-.025em;overflow-wrap:anywhere}
.handle{font-size:13px;color:var(--muted);margin-top:5px}
.platform{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#d9b8ff;background:#9147ff1c;border:1px solid #9147ff35;padding:5px 8px;border-radius:7px;margin-top:10px}
.twitch-mark{width:10px;height:10px;background:#a970ff;clip-path:polygon(0 0,100% 0,100% 75%,68% 75%,45% 100%,45% 75%,0 75%)}
.live-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;margin-top:9px;color:#a3a3b2}
.live-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#777786;flex:0 0 auto}
.live-status.is-live{color:#ff667a}
.live-status.is-live::before{background:#ff4057;box-shadow:0 0 10px #ff405777}
.live-status.is-loading{color:#a3a3b2}
.live-status.is-loading::before{background:#b9ff36;box-shadow:0 0 8px #b9ff3677}
.stream-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.stream-meta:empty{display:none}
.arrow{color:#777786;transition:.18s;flex:0 0 auto}.streamer:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 12px;grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:23px 0 32px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{color:var(--text)}
@media(max-width:650px){.wrap{width:min(100% - 24px,540px)}header{padding:18px 0}.hero{padding:44px 0 20px}.grid{grid-template-columns:1fr;gap:10px}.streamer{padding:14px}.avatar{width:58px;height:58px;flex-basis:58px}.navtag{font-size:10px}.search{width:100%}.toolbar{align-items:stretch}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <span class="brand">Стримеры</span>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Twitch-каналы</div>
    <h1><span>СТРИМЕРЫ</span></h1>
    <p class="lead">Выбирай канал, чтобы открыть Twitch и посмотреть трансляцию.</p>
  </section>
  <section aria-label="Список стримеров">
    <div class="toolbar">
      <div class="count"><strong id="visibleCount">10</strong> стримеров</div>
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Найти стримера..." aria-label="Найти стримера">
      </label>
    </div>
    <div class="category" id="mainCategory">
      <h2 class="category-title"><span>1°6</span></h2>
      <div class="grid" id="mainGrid"></div>
    </div>
    <div class="category" id="creatorCategory">
      <h2 class="category-title">Создатель</h2>
      <div class="grid" id="creatorGrid"></div>
    </div>
    <div class="category" id="othersCategory">
      <h2 class="category-title">Другие стримеры</h2>
      <div class="grid" id="othersGrid"></div>
    </div>
    <div class="empty" id="empty">Никого не нашли. Попробуй другой ник.</div>
  </section>
</main>
<footer class="wrap"><span>Открывай каналы и поддерживай стримеров на Twitch <span style="color:var(--accent)">✦</span></span></footer>
<script>
const streamers = [
  {name:"d1unizi", url:"https://www.twitch.tv/d1unizi", group:"main"},
  {name:"plovecmolodec", url:"https://www.twitch.tv/plovecmolodec", group:"main"},
  {name:"mob_nadziratel", url:"https://www.twitch.tv/mob_nadziratel", group:"creator"},
  {name:"stpdkerik232", url:"https://www.twitch.tv/stpdkerik232", group:"others"},
  {name:"ribafyga", url:"https://www.twitch.tv/ribafyga", group:"others"},
  {name:"mrbatosh", url:"https://www.twitch.tv/mrbatosh", group:"others"},
  {name:"roman16rus", url:"https://www.twitch.tv/roman16rus", group:"others"},
  {name:"rueumur", url:"https://www.twitch.tv/rueumur", group:"others"},
  {name:"cherrys_fox", url:"https://www.twitch.tv/cherrys_fox", group:"others"},
  {name:"kostyan_321r", url:"https://www.twitch.tv/kostyan_321r", group:"others"}
];
const palettes = [
  ["#b9ff36","#24320e"],["#a970ff","#321c4d"],["#ff7a59","#51251e"],
  ["#42d6c5","#153c3a"],["#ffcf5a","#493515"],["#ff6ca8","#4a1d35"],
  ["#7ea6ff","#1e2d51"],["#e7e7f0","#30303d"],["#f49dff","#44234a"],["#b9ff36","#263d10"]
];
function avatarSvg(name, i) {
  const [a,b] = palettes[i % palettes.length];
  const initials = name.replace(/[^a-z0-9]/gi,"").slice(0,2).toUpperCase();
  const shapes = `<circle cx="80" cy="80" r="62" fill="${a}" opacity=".12"/><path d="M0 112L48 62l29 25 35-48 48 57v64H0Z" fill="${a}" opacity=".16"/><circle cx="80" cy="61" r="27" fill="${a}" opacity=".88"/><path d="M31 145c3-30 22-45 49-45s46 15 49 45" fill="${a}"/><text x="80" y="154" font-family="Arial,sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="${b}">${initials}</text>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><rect width="160" height="160" rx="24" fill="${b}"/>${shapes}</svg>`);
}
const grids = {
  main: document.getElementById("mainGrid"),
  creator: document.getElementById("creatorGrid"),
  others: document.getElementById("othersGrid")
};
const categories = {
  main: document.getElementById("mainCategory"),
  creator: document.getElementById("creatorCategory"),
  others: document.getElementById("othersCategory")
};
const avatarCache = new Map();

async function loadTwitchAvatar(name, img) {
  // DecAPI returns the current Twitch profile-image URL; fallback remains if lookup fails.
  if (avatarCache.has(name)) {
    img.src = avatarCache.get(name);
    return;
  }
  try {
    const response = await fetch(`https://decapi.me/twitch/avatar/${encodeURIComponent(name)}`, {
      cache: "no-cache"
    });
    if (!response.ok) throw new Error("Avatar lookup failed");
    const avatarUrl = (await response.text()).trim();
    if (!/^https:\/\//i.test(avatarUrl)) throw new Error("Invalid avatar URL");
    avatarCache.set(name, avatarUrl);
    img.src = avatarUrl;
  } catch (error) {
    // Keep the generated placeholder avatar if the lookup service is unavailable.
  }
}

function render(filter="") {
  Object.values(grids).forEach(grid => grid.innerHTML = "");
  const normalizedFilter = filter.toLowerCase().trim();
  const matches = streamers.filter(item => item.name.toLowerCase().includes(normalizedFilter));
  matches.forEach(({name,url,group}) => {
    const i = streamers.findIndex(item => item.name === name);
    const card = document.createElement("a");
    card.className = "streamer";
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.setAttribute("aria-label", `Открыть Twitch-канал ${name}`);
    card.innerHTML = `<div class="avatar"><img src="${avatarSvg(name,i)}" alt="Аватар ${name}" loading="lazy"></div>
      <div class="info"><div class="name">${name}</div><div class="handle">@${name}</div><span class="platform"><span class="twitch-mark"></span> Twitch-канал</span><div class="live-status is-loading" data-status="${name}">Проверяем эфир…</div><div class="stream-meta" data-meta="${name}"></div></div>
      <svg class="arrow" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>`;
    grids[group].appendChild(card);
    loadTwitchAvatar(name, card.querySelector("img"));
  });
  Object.entries(categories).forEach(([group, section]) => {
    section.hidden = grids[group].children.length === 0;
  });
  document.getElementById("visibleCount").textContent = matches.length;
  document.getElementById("empty").style.display = matches.length ? "none" : "block";
}
async function refreshLiveStatuses() {
  try {
    const response = await fetch("/api/streams", { cache: "no-store" });
    if (!response.ok) throw new Error("Status endpoint unavailable");
    const payload = await response.json();
    const streams = payload.streams || {};
    streamers.forEach(({name}) => {
      const status = document.querySelector(`[data-status="${name}"]`);
      const meta = document.querySelector(`[data-meta="${name}"]`);
      if (!status || !meta) return;
      const item = streams[name];
      status.classList.remove("is-loading", "is-live");
      if (item && item.isLive) {
        status.classList.add("is-live");
        status.textContent = "В ЭФИРЕ";
        const viewers = Number.isFinite(item.viewerCount) ? ` · ${item.viewerCount.toLocaleString("ru-RU")} зрителей` : "";
        meta.textContent = `${item.title || "Прямой эфир"}${viewers}`;
      } else if (item && item.error) {
        status.textContent = "СТАТУС НЕДОСТУПЕН";
        meta.textContent = "Не удалось проверить эфир";
      } else {
        status.textContent = "НЕ В СЕТИ";
        meta.textContent = "";
      }
    });
  } catch (error) {
    document.querySelectorAll(".live-status").forEach(el => {
      el.classList.remove("is-loading", "is-live");
      el.textContent = "СТАТУС НЕДОСТУПЕН";
    });
    document.querySelectorAll(".stream-meta").forEach(el => {
      el.textContent = "Запусти сайт через сервер и настрой Twitch API";
    });
  }
}
document.getElementById("search").addEventListener("input", e => render(e.target.value));
render();
refreshLiveStatuses();
setInterval(refreshLiveStatuses, 60000);
</script>
</body>
</html>
